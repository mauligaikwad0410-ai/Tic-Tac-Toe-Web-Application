<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Ultimate Edition</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            overflow: hidden;
        }

        /* ===== ANIMATED BACKGROUND PARTICLES ===== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex: 1;
            gap: 40px;
            padding: 30px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .left-section {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .right-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== HEADER ===== */
        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: titleGlow 3s ease-in-out infinite;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        /* ===== GAME MODE SELECTOR ===== */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
        }

        .mode-btn:hover {
            border-color: rgba(102, 126, 234, 0.6);
            background: rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }

        .mode-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.3);
        }

        /* ===== DIFFICULTY SELECTOR ===== */
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            opacity: 1;
            max-height: 60px;
            transition: all 0.4s ease;
            flex-wrap: wrap;
        }

        .difficulty-selector.hidden {
            opacity: 0;
            max-height: 0;
            margin-bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .diff-btn {
            padding: 7px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .diff-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .diff-btn.active {
            color: #ffffff;
        }

        .diff-btn.easy.active {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
        }

        .diff-btn.medium.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .diff-btn.hard.active {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.15);
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.2);
        }

        .diff-btn.impossible.active {
            border-color: #c084fc;
            background: rgba(192, 132, 252, 0.15);
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.2);
        }

        /* ===== SCOREBOARD ===== */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .score-card {
            text-align: center;
            min-width: 80px;
        }

        .score-card .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
        }

        .score-card .value {
            font-size: 2rem;
            font-weight: 800;
        }

        .score-card.x-score .value {
            color: #667eea;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .score-card.draw-score .value {
            color: rgba(255, 255, 255, 0.4);
        }

        .score-card.o-score .value {
            color: #f093fb;
            text-shadow: 0 0 20px rgba(240, 147, 251, 0.5);
        }

        .score-divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.1);
            align-self: stretch;
        }

        /* ===== STATUS DISPLAY ===== */
        .status {
            font-size: 1.15rem;
            margin-bottom: 20px;
            margin-top: 15px;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .status .turn-indicator {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status .turn-indicator.x-turn {
            background: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }

        .status .turn-indicator.o-turn {
            background: #f093fb;
            box-shadow: 0 0 15px rgba(240, 147, 251, 0.6);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        /* ===== GAME BOARD ===== */
        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .cell {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cell:hover:not(.taken):not(.game-over) {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.03);
        }

        .cell:hover:not(.taken):not(.game-over)::before {
            opacity: 1;
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.game-over {
            cursor: not-allowed;
        }

        .cell .mark {
            font-size: 0;
            line-height: 1;
            animation: markAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes markAppear {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* X Mark SVG Style */
        .mark-x {
            width: 55px;
            height: 55px;
        }

        .mark-x line {
            stroke: #667eea;
            stroke-width: 8;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.6));
            stroke-dasharray: 70;
            stroke-dashoffset: 70;
            animation: drawLine 0.4s ease forwards;
        }

        .mark-x line:nth-child(2) {
            animation-delay: 0.15s;
        }

        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* O Mark SVG Style */
        .mark-o {
            width: 55px;
            height: 55px;
        }

        .mark-o circle {
            fill: none;
            stroke: #f093fb;
            stroke-width: 7;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(240, 147, 251, 0.6));
            stroke-dasharray: 140;
            stroke-dashoffset: 140;
            animation: drawCircle 0.5s ease forwards;
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Winning cells */
        .cell.winner {
            animation: winPulse 0.6s ease-in-out infinite alternate;
            border-color: rgba(74, 222, 128, 0.6) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        @keyframes winPulse {
            0% {
                box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 30px rgba(74, 222, 128, 0.4);
                transform: scale(1.05);
            }
        }

        /* ===== WIN LINE OVERLAY ===== */
        .win-line {
            position: absolute;
            background: linear-gradient(90deg, #4ade80, #22d3ee);
            border-radius: 10px;
            z-index: 10;
            opacity: 0;
            animation: winLineAppear 0.5s ease forwards 0.2s;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        @keyframes winLineAppear {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 0.8;
                transform: scale(1);
            }
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-restart {
            border-color: rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
        }

        .btn-restart:hover {
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-reset {
            border-color: rgba(248, 113, 113, 0.3);
            background: rgba(248, 113, 113, 0.08);
        }

        .btn-reset:hover {
            border-color: rgba(248, 113, 113, 0.7);
            box-shadow: 0 8px 25px rgba(248, 113, 113, 0.2);
        }

        /* ===== WINNER OVERLAY ===== */
        .winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .winner-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .winner-modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px 50px;
            text-align: center;
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }

        .winner-overlay.active .winner-modal {
            transform: scale(1) translateY(0);
        }

        .winner-modal .emoji {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .winner-modal h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .winner-modal p {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .winner-modal .btn {
            margin: 0 5px;
        }

        /* ===== CONFETTI ===== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100%) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== GAME LOG ===== */
        .game-log {
            margin-top: 20px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 80px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        .game-log::-webkit-scrollbar {
            width: 4px;
        }

        .game-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .game-log .log-entry {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            padding: 2px 0;
            letter-spacing: 0.5px;
        }

        .game-log .log-entry:last-child {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }

            .left-section {
                flex: 0 0 auto;
                width: 100%;
                max-width: 400px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .cell {
                width: 85px;
                height: 85px;
            }

            .mark-x, .mark-o {
                width: 40px;
                height: 40px;
            }

            .scoreboard {
                gap: 15px;
            }

            .score-card .value {
                font-size: 1.5rem;
            }

            .mode-btn {
                padding: 8px 16px;
                font-size: 0.78rem;
            }

            .winner-modal {
                padding: 30px 25px;
            }

            .winner-modal h2 {
                font-size: 1.4rem;
            }

            .container {
                padding: 15px;
                gap: 15px;
            }
        }

        @media (max-width: 360px) {
            .cell {
                width: 75px;
                height: 75px;
            }

            .board {
                gap: 6px;
                padding: 10px;
            }
        }

        /* ===== THINKING ANIMATION ===== */
        .thinking {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            margin-left: 8px;
        }

        .thinking span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f093fb;
            animation: thinkingDot 1.2s ease-in-out infinite;
        }

        .thinking span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes thinkingDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--white);
            padding: 20px;
            opacity: 0.9;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        footer i {
            color: #ff6b6b;
            animation: heartbeat 1.5s ease infinite;
        }
    </style>
</head>
<body>

    <!-- Background Particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Confetti Container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Winner Overlay -->
    <div class="winner-overlay" id="winnerOverlay">
        <div class="winner-modal">
            <div class="emoji" id="winnerEmoji">🎉</div>
            <h2 id="winnerTitle">Player X Wins!</h2>
            <p id="winnerSubtitle">What an incredible game!</p>
            <button class="btn btn-restart" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <!-- Header -->
            <div class="header">
                <h1>Tic-Tac-Toe</h1>
                <p class="subtitle">Ultimate Edition</p>
            </div>

            <!-- Game Mode Selector -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="ai" onclick="setMode('ai')">
                    🤖 vs AI
                </button>
                <button class="mode-btn" data-mode="pvp" onclick="setMode('pvp')">
                    👥 2 Players
                </button>
            </div>

            <!-- Difficulty Selector -->
            <div class="difficulty-selector" id="difficultySelector">
                <button class="diff-btn easy" data-diff="easy" onclick="setDifficulty('easy')">Easy</button>
                <button class="diff-btn medium" data-diff="medium" onclick="setDifficulty('medium')">Medium</button>
                <button class="diff-btn hard active" data-diff="hard" onclick="setDifficulty('hard')">Hard</button>
                <button class="diff-btn impossible" data-diff="impossible" onclick="setDifficulty('impossible')">Impossible</button>
            </div>

            <!-- Scoreboard -->
            <div class="scoreboard">
                <div class="score-card x-score">
                    <div class="label" id="xLabel">Player X</div>
                    <div class="value" id="xScore">0</div>
                </div>
                <div class="score-divider"></div>
                <div class="score-card draw-score">
                    <div class="label">Draw</div>
                    <div class="value" id="drawScore">0</div>
                </div>
                <div class="score-divider"></div>
                <div class="score-card o-score">
                    <div class="label" id="oLabel">AI (O)</div>
                    <div class="value" id="oScore">0</div>
                </div>
            </div>

            <!-- Status -->
            <div class="status" id="status">
                <span class="turn-indicator x-turn"></span>
                Player X's Turn
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <!-- Game Board -->
            <div class="board-container">
                <div class="board" id="board">
                    <div class="cell" data-index="0" onclick="handleCellClick(0)"></div>
                    <div class="cell" data-index="1" onclick="handleCellClick(1)"></div>
                    <div class="cell" data-index="2" onclick="handleCellClick(2)"></div>
                    <div class="cell" data-index="3" onclick="handleCellClick(3)"></div>
                    <div class="cell" data-index="4" onclick="handleCellClick(4)"></div>
                    <div class="cell" data-index="5" onclick="handleCellClick(5)"></div>
                    <div class="cell" data-index="6" onclick="handleCellClick(6)"></div>
                    <div class="cell" data-index="7" onclick="handleCellClick(7)"></div>
                    <div class="cell" data-index="8" onclick="handleCellClick(8)"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-restart" onclick="restartGame()">🔄 New Game</button>
                <button class="btn btn-reset" onclick="resetScores()">🗑️ Reset Scores</button>
            </div>

            <!-- Game Log -->
            <div class="game-log" id="gameLog">
                <div class="log-entry">🎮 Game started! Good luck!</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>2026 Tic-Tac-Toe WEB Application - Made with ❤️ By Mauli Gaikwad.</p>
    </footer>

    <script>
        // ==========================================
        // GAME STATE
        // ==========================================
        let gameState = {
            board: Array(9).fill(''),
            currentPlayer: 'X',
            gameActive: true,
            gameMode: 'ai',         // 'ai' or 'pvp'
            difficulty: 'hard',     // 'easy', 'medium', 'hard', 'impossible'
            scores: { X: 0, O: 0, draw: 0 },
            moveHistory: [],
            isAiThinking: false,
            gameNumber: 1
        };

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],  // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8],  // columns
            [0, 4, 8], [2, 4, 6]               // diagonals
        ];

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const cells = document.querySelectorAll('.cell');
        const statusEl = document.getElementById('status');
        const xScoreEl = document.getElementById('xScore');
        const oScoreEl = document.getElementById('oScore');
        const drawScoreEl = document.getElementById('drawScore');
        const xLabelEl = document.getElementById('xLabel');
        const oLabelEl = document.getElementById('oLabel');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const gameLogEl = document.getElementById('gameLog');
        const difficultySelector = document.getElementById('difficultySelector');

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            createParticles();
            updateLabels();
            addLog('🎮 Game started! Good luck!');
        }

        // ==========================================
        // GAME MODE & DIFFICULTY
        // ==========================================
        function setMode(mode) {
            gameState.gameMode = mode;

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            if (mode === 'pvp') {
                difficultySelector.classList.add('hidden');
            } else {
                difficultySelector.classList.remove('hidden');
            }

            updateLabels();
            restartGame();
            addLog(`🔄 Mode changed to ${mode === 'ai' ? 'Player vs AI' : '2 Players'}`);
        }

        function setDifficulty(diff) {
            gameState.difficulty = diff;

            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diff);
            });

            restartGame();
            addLog(`⚙️ Difficulty set to ${diff.charAt(0).toUpperCase() + diff.slice(1)}`);
        }

        function updateLabels() {
            xLabelEl.textContent = 'Player X';
            oLabelEl.textContent = gameState.gameMode === 'ai' ? 'AI (O)' : 'Player O';
        }

        // ==========================================
        // CELL CLICK HANDLER
        // ==========================================
        function handleCellClick(index) {
            if (!gameState.gameActive ||
                gameState.board[index] !== '' ||
                gameState.isAiThinking) {
                return;
            }

            makeMove(index, gameState.currentPlayer);

            if (gameState.gameActive && gameState.gameMode === 'ai' && gameState.currentPlayer === 'O') {
                gameState.isAiThinking = true;
                updateStatus();

                const delay = gameState.difficulty === 'easy' ? 300 :
                              gameState.difficulty === 'medium' ? 500 :
                              gameState.difficulty === 'hard' ? 600 : 700;

                setTimeout(() => {
                    aiMove();
                    gameState.isAiThinking = false;
                }, delay);
            }
        }

        // ==========================================
        // MAKE MOVE
        // ==========================================
        function makeMove(index, player) {
            gameState.board[index] = player;
            gameState.moveHistory.push({ index, player });

            const cell = cells[index];
            cell.classList.add('taken');
            cell.innerHTML = `<div class="mark">${getMarkSVG(player)}</div>`;

            const positions = ['top-left', 'top-center', 'top-right',
                              'middle-left', 'center', 'middle-right',
                              'bottom-left', 'bottom-center', 'bottom-right'];
            addLog(`${player === 'X' ? '❌' : '⭕'} ${player} placed at ${positions[index]}`);

            // Check game result
            const winResult = checkWin(gameState.board, player);
            if (winResult) {
                handleWin(player, winResult);
                return;
            }

            if (checkDraw(gameState.board)) {
                handleDraw();
                return;
            }

            // Switch player
            gameState.currentPlayer = player === 'X' ? 'O' : 'X';
            updateStatus();
        }

        // ==========================================
        // SVG MARKS
        // ==========================================
        function getMarkSVG(player) {
            if (player === 'X') {
                return `<svg class="mark-x" viewBox="0 0 50 50">
                    <line x1="10" y1="10" x2="40" y2="40"/>
                    <line x1="40" y1="10" x2="10" y2="40"/>
                </svg>`;
            } else {
                return `<svg class="mark-o" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="18"/>
                </svg>`;
            }
        }

        // ==========================================
        // WIN/DRAW CHECKS
        // ==========================================
        function checkWin(board, player) {
            for (const pattern of winPatterns) {
                if (pattern.every(index => board[index] === player)) {
                    return pattern;
                }
            }
            return null;
        }

        function checkDraw(board) {
            return board.every(cell => cell !== '');
        }

        // ==========================================
        // HANDLE OUTCOMES
        // ==========================================
        function handleWin(player, pattern) {
            gameState.gameActive = false;
            gameState.scores[player]++;
            updateScoreDisplay();

            // Highlight winning cells
            pattern.forEach(index => {
                cells[index].classList.add('winner');
            });

            // Mark all cells as game-over
            cells.forEach(cell => cell.classList.add('game-over'));

            const isAI = gameState.gameMode === 'ai' && player === 'O';
            const winnerName = isAI ? 'AI' : `Player ${player}`;

            addLog(`🏆 ${winnerName} wins! (Game #${gameState.gameNumber})`);
            gameState.gameNumber++;

            // Show winner modal after short delay
            setTimeout(() => {
                showWinnerModal(player);
                if (!isAI) createConfetti();
            }, 800);
        }

        function handleDraw() {
            gameState.gameActive = false;
            gameState.scores.draw++;
            updateScoreDisplay();

            cells.forEach(cell => cell.classList.add('game-over'));

            statusEl.innerHTML = `😐 It's a Draw!`;
            addLog(`🤝 Game #${gameState.gameNumber} ended in a draw!`);
            gameState.gameNumber++;

            setTimeout(() => {
                showDrawModal();
            }, 800);
        }

        // ==========================================
        // UI UPDATES
        // ==========================================
        function updateStatus() {
            if (!gameState.gameActive) return;

            if (gameState.isAiThinking) {
                statusEl.innerHTML = `
                    <span class="turn-indicator o-turn"></span>
                    AI is thinking
                    <span class="thinking">
                        <span></span><span></span><span></span>
                    </span>`;
            } else {
                const turnClass = gameState.currentPlayer === 'X' ? 'x-turn' : 'o-turn';
                const playerName = (gameState.gameMode === 'ai' && gameState.currentPlayer === 'O')
                    ? 'AI' : `Player ${gameState.currentPlayer}`;
                statusEl.innerHTML = `
                    <span class="turn-indicator ${turnClass}"></span>
                    ${playerName}'s Turn`;
            }
        }

        function updateScoreDisplay() {
            xScoreEl.textContent = gameState.scores.X;
            oScoreEl.textContent = gameState.scores.O;
            drawScoreEl.textContent = gameState.scores.draw;

            // Animate score change
            const scoreEl = document.querySelector(
                gameState.currentPlayer === 'X' || (!gameState.gameActive && checkWin(gameState.board, 'X'))
                    ? '.x-score .value'
                    : checkDraw(gameState.board) ? '.draw-score .value' : '.o-score .value'
            );
            if (scoreEl) {
                scoreEl.style.transform = 'scale(1.3)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 300);
            }
        }

        // ==========================================
        // MODALS
        // ==========================================
        function showWinnerModal(player) {
            const isAI = gameState.gameMode === 'ai' && player === 'O';
            document.getElementById('winnerEmoji').textContent = isAI ? '🤖' : '🎉';
            document.getElementById('winnerTitle').textContent = isAI ? 'AI Wins!' : `Player ${player} Wins!`;
            document.getElementById('winnerSubtitle').textContent = isAI
                ? 'Better luck next time!'
                : 'What an incredible game!';
            winnerOverlay.classList.add('active');
        }

        function showDrawModal() {
            document.getElementById('winnerEmoji').textContent = '🤝';
            document.getElementById('winnerTitle').textContent = "It's a Draw!";
            document.getElementById('winnerSubtitle').textContent = 'Great minds think alike!';
            winnerOverlay.classList.add('active');
        }

        // ==========================================
        // GAME CONTROLS
        // ==========================================
        function restartGame() {
            gameState.board = Array(9).fill('');
            gameState.currentPlayer = 'X';
            gameState.gameActive = true;
            gameState.moveHistory = [];
            gameState.isAiThinking = false;

            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('taken', 'winner', 'game-over');
            });

            // Remove any win lines
            document.querySelectorAll('.win-line').forEach(el => el.remove());

            winnerOverlay.classList.remove('active');
            updateStatus();
        }

        function resetScores() {
            gameState.scores = { X: 0, O: 0, draw: 0 };
            gameState.gameNumber = 1;
            updateScoreDisplay();
            restartGame();
            gameLogEl.innerHTML = '';
            addLog('🗑️ Scores reset! Starting fresh.');
        }

        // ==========================================
        // AI LOGIC
        // ==========================================
        function aiMove() {
            if (!gameState.gameActive) return;

            let move;
            switch (gameState.difficulty) {
                case 'easy':
                    move = getEasyMove();
                    break;
                case 'medium':
                    move = getMediumMove();
                    break;
                case 'hard':
                    move = getHardMove();
                    break;
                case 'impossible':
                    move = getBestMove();
                    break;
                default:
                    move = getBestMove();
            }

            if (move !== undefined && move !== null) {
                makeMove(move, 'O');
            }
        }

        // Easy: Random moves
        function getEasyMove() {
            const available = getAvailableMoves(gameState.board);
            return available[Math.floor(Math.random() * available.length)];
        }

        // Medium: Block wins, take wins, otherwise random
        function getMediumMove() {
            const board = gameState.board;
            const available = getAvailableMoves(board);

            // Check if AI can win
            for (const move of available) {
                board[move] = 'O';
                if (checkWin(board, 'O')) {
                    board[move] = '';
                    return move;
                }
                board[move] = '';
            }

            // Block player win
            for (const move of available) {
                board[move] = 'X';
                if (checkWin(board, 'X')) {
                    board[move] = '';
                    return move;
                }
                board[move] = '';
            }

            // Take center
            if (board[4] === '') return 4;

            // Random
            return available[Math.floor(Math.random() * available.length)];
        }

        // Hard: Minimax with occasional random moves (30% chance)
        function getHardMove() {
            if (Math.random() < 0.3) {
                // Sometimes play a smart-but-not-perfect move
                return getMediumMove();
            }
            return getBestMove();
        }

        // Impossible: Perfect Minimax
        function getBestMove() {
            const board = [...gameState.board];
            let bestScore = -Infinity;
            let bestMove = null;

            const available = getAvailableMoves(board);

            for (const move of available) {
                board[move] = 'O';
                const score = minimax(board, 0, false, -Infinity, Infinity);
                board[move] = '';

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }

            return bestMove;
        }

        function minimax(board, depth, isMaximizing, alpha, beta) {
            // Terminal states
            if (checkWin(board, 'O')) return 10 - depth;
            if (checkWin(board, 'X')) return depth - 10;
            if (checkDraw(board)) return 0;

            if (isMaximizing) {
                let maxScore = -Infinity;
                for (const move of getAvailableMoves(board)) {
                    board[move] = 'O';
                    const score = minimax(board, depth + 1, false, alpha, beta);
                    board[move] = '';
                    maxScore = Math.max(maxScore, score);
                    alpha = Math.max(alpha, score);
                    if (beta <= alpha) break;
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (const move of getAvailableMoves(board)) {
                    board[move] = 'X';
                    const score = minimax(board, depth + 1, true, alpha, beta);
                    board[move] = '';
                    minScore = Math.min(minScore, score);
                    beta = Math.min(beta, score);
                    if (beta <= alpha) break;
                }
                return minScore;
            }
        }

        function getAvailableMoves(board) {
            return board.reduce((moves, cell, index) => {
                if (cell === '') moves.push(index);
                return moves;
            }, []);
        }

        // ==========================================
        // VISUAL EFFECTS
        // ==========================================

        // Background Particles
        function createParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 40 + 10;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 20 + 15}s`;
                particle.style.animationDelay = `${Math.random() * 20}s`;
                container.appendChild(particle);
            }
        }

        // Confetti
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4ade80', '#fbbf24', '#f87171', '#22d3ee'];

            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const size = Math.random() * 10 + 5;
                piece.style.width = `${size}px`;
                piece.style.height = `${size * (Math.random() + 0.5)}px`;
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDuration = `${Math.random() * 2 + 2}s`;
                piece.style.animationDelay = `${Math.random() * 1}s`;
                container.appendChild(piece);
            }

            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // ==========================================
        // GAME LOG
        // ==========================================
        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = message;
            gameLogEl.appendChild(entry);
            gameLogEl.scrollTop = gameLogEl.scrollHeight;

            // Keep log manageable
            while (gameLogEl.children.length > 50) {
                gameLogEl.removeChild(gameLogEl.firstChild);
            }
        }

        // ==========================================
        // KEYBOARD SUPPORT
        // ==========================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                restartGame();
            }
            // Numpad support (1-9 maps to board positions)
            const numKey = parseInt(e.key);
            if (numKey >= 1 && numKey <= 9) {
                // Map numpad layout to board (7,8,9 = top row, etc.)
                const keyMap = { 7: 0, 8: 1, 9: 2, 4: 3, 5: 4, 6: 5, 1: 6, 2: 7, 3: 8 };
                const index = keyMap[numKey];
                if (index !== undefined) {
                    handleCellClick(index);
                }
            }
        });

        // Close modal on overlay click
        winnerOverlay.addEventListener('click', (e) => {
            if (e.target === winnerOverlay) {
                restartGame();
            }
        });

        // ==========================================
        // START
        // ==========================================
        init();
    </script>
</body>
</html>
